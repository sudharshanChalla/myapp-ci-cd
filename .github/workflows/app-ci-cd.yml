name: app-ci-cd
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q

      - name: Validate Docker build
        run: docker build -t myapp:${{ github.sha }} .

      - name: Warmup artifact
        run: echo "run $GITHUB_RUN_ID" > hello-9711.txt

      - uses: actions/upload-artifact@v4
        with:
          name: hello-9711
          path: hello-9711.txt
